# DKMS configuration for Claude Kernel Module
#
# DKMS (Dynamic Kernel Module Support) allows the module to be
# automatically rebuilt when the kernel is updated.
#
# Installation:
#   sudo cp -r claude-kernel-module /usr/src/claude_module-1.0.0
#   sudo dkms add -m claude_module -v 1.0.0
#   sudo dkms build -m claude_module -v 1.0.0
#   sudo dkms install -m claude_module -v 1.0.0

PACKAGE_NAME="claude_module"
PACKAGE_VERSION="1.0.0"

# Module information
BUILT_MODULE_NAME[0]="claude_module"
BUILT_MODULE_LOCATION[0]=""

# Destination location in kernel tree
DEST_MODULE_LOCATION[0]="/updates"

# Autoinstall on kernel update
AUTOINSTALL="yes"

# Build command
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"

# Clean command
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"
